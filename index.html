
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABRO DATA</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080b12;
      color: white;
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 500px;
      background: #111827;
      padding: 30px;
      border: 1px solid #263247;
      border-radius: 18px;
    }

    h1 { letter-spacing: 2px; }
    .subtitle { color: #9ca3af; }

    textarea {
      width: 100%;
      height: 150px;
      padding: 14px;
      background: #080b12;
      color: white;
      border: 1px solid #374151;
      border-radius: 9px;
      resize: vertical;
      font: inherit;
    }

    label {
      display: block;
      margin-top: 15px;
      color: #cbd5e1;
      font-size: 13px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      background: #16a34a;
      color: white;
      border: 0;
      border-radius: 9px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #status {
      min-height: 24px;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <main class="app">
    <h1>ABRO DATA.</h1>
    <p class="subtitle">Data Collection Platform</p>

    <form id="form">
      <textarea
        id="message"
        placeholder="Write your message..."
        maxlength="5000"
        required
      ></textarea>

      <label>
        <input type="checkbox" id="consent" required>
        I agree to submit my message for analysis.
      </label>

      <button id="btn" type="submit">SUBMIT DATA →</button>
    </form>

    <p id="status" role="status"></p>
  </main>

  <script>
    const SUPABASE_URL =
      "https://saqmplsgashruvgxyqyf.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_aG3O0MLst2EAyBJgKi8xIA_PV8nGoLq";

    const status = document.getElementById("status");
    const form = document.getElementById("form");
    const button = document.getElementById("btn");

    if (!window.supabase) {
      status.textContent = "ERROR: Supabase library failed to load.";
    } else {
      const db = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const message = document
          .getElementById("message")
          .value.trim();

        if (!message) return;

        if (!document.getElementById("consent").checked) {
          status.textContent = "Please accept the consent.";
          return;
        }

        button.disabled = true;
        status.textContent = "Sending data...";

        try {
          const { error } = await db
            .from("submissions")
            .insert({ message });

          if (error) throw error;

          status.textContent = "SUCCESS! DATA RECEIVED.";
          form.reset();

        } catch (error) {
          console.error(error);
          status.textContent = "ERROR: " + error.message;

        } finally {
          button.disabled = false;
        }
      });
    }
  </script>
</body>
</html>
